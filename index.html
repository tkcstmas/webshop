<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználók</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <main class="container py-4">
        <h1 class="mb-4">Felhasználók</h1>

        <section class="mb-4" aria-labelledby="new-user-heading">
            <h2 id="new-user-heading" class="h4 mb-3">Új felhasználó hozzáadása</h2>
            <form id="new-user-form" class="row g-3">
                
                <div class="md:col-6">
                    <label for="user-name" class="form-label">Név</label>
                    <input id="user-name" name="name" class="form-control" type="text" required>
                </div>
                <div class="md:col-6">
                    <label for="user-email" class="form-label">E-mail</label>
                    <input id="user-email" name="email" class="form-control" type="email" required>
                </div>
                <div class="md:col-4">
                    <label for="user-city" class="form-label">Város</label>
                    <input id="user-city" name="city" class="form-control" type="text">
                </div>
                <div class="md:col-4">
                    <label for="user-phone" class="form-label">Telefonszám</label>
                    <input id="user-phone" name="phone" class="form-control" type="tel">
                </div>
                <div class="md:col-4">
                    <label for="user-role" class="form-label">Szerepkör</label>
                    <input id="user-role" name="role" class="form-control" type="text">
                </div>
                <div class="col-12">
                    <button id="add-user-button" class="btn btn-primary" type="submit">Új felhasználó hozzáadása</button>
                </div>
            </form>
        </section>

        <section id="edit-user-section" class="mb-4" aria-labelledby="edit-user-heading" hidden>
            <h2 id="edit-user-heading" class="h4 mb-3">Felhasználó szerkesztése</h2>
            <form id="edit-user-form" class="row g-3">
                <input id="edit-user-id" name="id" type="hidden">
                <div class="col-md-6">
                    <label for="edit-user-name" class="form-label">Név</label>
                    <input id="edit-user-name" name="name" class="form-control" type="text" required>
                </div>
                <div class="col-md-6">
                    <label for="edit-user-email" class="form-label">E-mail</label>
                    <input id="edit-user-email" name="email" class="form-control" type="email" required>
                </div>
                <div class="col-md-4">
                    <label for="edit-user-city" class="form-label">Város</label>
                    <input id="edit-user-city" name="city" class="form-control" type="text">
                </div>
                <div class="col-md-4">
                    <label for="edit-user-phone" class="form-label">Telefonszám</label>
                    <input id="edit-user-phone" name="phone" class="form-control" type="tel">
                </div>
                <div class="col-md-4">
                    <label for="edit-user-role" class="form-label">Szerepkör</label>
                    <input id="edit-user-role" name="role" class="form-control" type="text">
                </div>
                <div class="col-12">
                    <button id="save-user-changes-button" class="btn btn-primary" type="submit">Módosítások mentése</button>
                    <button id="cancel-edit-button" class="btn btn-outline-secondary" type="button">Mégse</button>
                </div>
            </form>
        </section>

        <div id="users-status" class="alert alert-info" role="status" aria-live="polite">
            Felhasználók betöltése...
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Név</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Város</th>
                        <th scope="col">Telefonszám</th>
                        <th scope="col">Szerepkör</th>
                        <th scope="col">Műveletek</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </main>

    <!-- Bootstrap 6 ESM alapú JS csomag (opcionális, ha használsz interaktív komponenseket) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
